; BLE companion firmware template (shared by BLE-only and BLE+USB builds)
[heltec_v4_companion_ble]
extends = heltec_v4_oled
build_flags =
  ${heltec_v4_oled.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SSD1306Display
  -D USE_NIMBLE          ; lightweight NimBLE host instead of Bluedroid (lower power)
  -D BLE_PIN_CODE=123456   ; dynamic, random PIN
  -D AUTO_SHUTDOWN_MILLIVOLTS=3400
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_WIFI_INTERFACE
  -D PIN_BUZZER=4
  -D MESH_PACKET_LOGGING=1   ; logs every RX/TX packet on the USB console (forwarding evidence)
  ; boot-time optimization: setup() runs at the fast 240MHz default clock and
  ; drops to 80MHz when done -- fast boot, same runtime power draw as before
  -D ESP32_CPU_FREQ_AFTER_BOOT
  -D ENV_GPS_DETECT_MS=750   ; no GNSS attached: shorten the boot-time GPS probe (default 5s)
  -D BOOT_SCREEN_MILLIS=1000 ; shorter splash screen
  -D ESP32_PM_LIGHT_SLEEP    ; auto light sleep via esp_pm (requires the PM-enabled IDF libs)
  ; BLE power: request 40-60ms connection interval with slave latency 4 (radio+CPU
  ; wake ~5x less often when connected), and advertise slower when disconnected.
  ; NOTE: 2M PHY / manual TX power calls were removed -- they wedged the
  ; Bluedroid controller on connect (device stopped advertising, app crashed early).
  -D BLE_CONN_INTERVAL_MIN=32
  -D BLE_CONN_INTERVAL_MAX=48
  -D BLE_CONN_SLAVE_LATENCY=4
  -D BLE_ADV_INTERVAL_MIN=320  ; 200ms
  -D BLE_ADV_INTERVAL_MAX=640  ; 400ms screen
  ; EU/UK (Narrow) preset: 869.618MHz / SF8 / BW62.5 / CR8
  -D LORA_FREQ=869.618
  -D LORA_SF=8
  -D LORA_BW=62.5
  -D LORA_CR=8
  ; allow app-enabled repeater mode on our frequency too (defaults: 433.000/869.495/918.000)
  -D ALLOWED_REPEAT_FREQ_RANGE={433000,433000},{869495,869495},{869618,869618},{918000,918000}
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${heltec_v4_oled.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/buzzer.cpp>
  +<helpers/esp32/*.cpp>
  +<helpers/wifi/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${heltec_v4_oled.lib_deps}
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0
  h2zero/NimBLE-Arduino @ ^1.4.3

